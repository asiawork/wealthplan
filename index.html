<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wealth Plan Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="backfill.js"></script>
<style>
/* Layout: tool controls on top, a fixed 1280x720 "slide" scaled to fit, weights editor beside it. */
@font-face{font-family:'BLS';src:url('fonts/BLS-Bold.ttf');font-weight:700;font-display:swap}
@font-face{font-family:'BLS';src:url('fonts/BLS-Regular.ttf');font-weight:400;font-display:swap}
@font-face{font-family:'BLS Text';src:url('fonts/BLS_Text-Regular.ttf');font-weight:400;font-display:swap}
@font-face{font-family:'BLS Text';src:url('fonts/BLS_Text-Bold.ttf');font-weight:700;font-display:swap}
:root{
  --navy:#16233a; --navy-2:#22324f; --ink:#16233a; --muted:#6a7488; --line:#d6dbe4;
  --bg:#eef1f5; --paper:#ffffff; --pos:#16a34a; --neg:#e3191b; --accent:#1f5fbf;
  --c1:#3b7cc4; --c2:#a5adbf; --c3:#2b4167; --c4:#dbe7f7; --c5:#7aa5d8; --c6:#5b6474;
  --head:'BLS','Kanit',system-ui,sans-serif; --body:'BLS Text','Kanit',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
.wrap{max-width:1500px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:14px}
.topbar h1{font-family:var(--head);font-size:20px;margin:0;color:var(--navy);font-weight:700}
.datainfo{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.uppop{position:relative}
.upbtn{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:10px;padding:8px 16px;font-weight:600;font-size:14px;cursor:pointer;box-shadow:0 1px 0 rgba(22,35,58,.08)}
.upbtn:hover,.upbtn[aria-expanded="true"]{background:#f3f5f9}
.upbtn.done{border-color:#16a34a;background:#eaf7ee;color:#15803d}
.upbtn.done:hover,.upbtn.done[aria-expanded="true"]{background:#dcf1e3}
.uppanel{position:absolute;right:0;top:calc(100% + 10px);width:min(360px,calc(100vw - 32px));background:#fff;border-radius:14px;box-shadow:0 12px 32px rgba(22,35,58,.22);padding:18px 20px;z-index:20;color:var(--ink);font-size:13.5px}
.uppanel h3{font-family:var(--head);font-size:17px;margin:0 0 6px;color:var(--navy)}
.uppanel p{margin:0 0 10px;color:var(--muted);line-height:1.55}
.upsteps{margin:4px 0 14px;padding-left:20px;line-height:1.75;text-align:left}
.upsteps b{color:var(--ink)}
.upsteps a{color:var(--accent);font-weight:600;text-decoration:underline}
.kbd{display:inline-block;border:1px solid var(--line);border-radius:5px;padding:0 6px;font-size:12px;background:#f6f8fb;color:var(--ink)}
.upnote{font-size:12px;color:var(--muted);margin:12px 0 0 !important;line-height:1.5}
.uplead{color:var(--muted);max-width:520px;margin:6px auto 10px;line-height:1.55}
.drop .upsteps{display:inline-block}

.chip b{color:var(--ink);font-weight:600}
.chip .ok{color:var(--pos)} .chip .no{color:var(--neg)}
.btn{border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:500}
.btn.ghost{background:#fff;color:var(--navy)}
.btn:focus-visible,.tab:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* upload */
.drop{background:#fff;border:2px dashed #b9c2d2;border-radius:14px;padding:36px 24px;text-align:center;max-width:760px;margin:40px auto}
.drop.over{border-color:var(--accent);background:#f3f7fd}
.drop h2{font-family:var(--head);margin:0 0 8px;color:var(--navy)}
.drop ol{text-align:left;display:inline-block;margin:12px 0 18px;color:var(--muted);line-height:1.7}
.drop .err{color:var(--neg);margin-top:12px;font-weight:500}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:14px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px}
.tab{border:0;background:none;padding:7px 12px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tab[aria-pressed="true"]{background:var(--navy);color:#fff}
.range{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;color:var(--muted);font-size:13px}
.range input{border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:#fff}
.range .btn{padding:5px 10px;font-size:12.5px}

.main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:1100px){.main{grid-template-columns:minmax(0,1fr)}}
.stage{min-width:0}
.scaler{width:100%;overflow:hidden;border-radius:6px;box-shadow:0 2px 14px rgba(22,35,58,.12);background:#fff}
.slide{width:1280px;height:720px;transform-origin:0 0;position:relative;background:var(--paper);font-family:var(--head);color:var(--ink)}
.eq+.eq{margin-top:14px}
.hp-tabs{display:flex;gap:6px}
.hp-tabs button{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:5px 12px;font-weight:600;font-size:12.5px;color:var(--muted);cursor:pointer}
.hp-tabs button[aria-pressed="true"]{background:#0051e8;border-color:#0051e8;color:#fff}
.hp-tabs button:disabled{opacity:.35;cursor:not-allowed}
.hp-legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13.5px;margin:4px 0 2px}
.hp-legend i{width:10px;height:10px;border-radius:2px;background:#0051e8}
.hp-legend span{font-size:12px}
.hp-prob{display:flex;gap:20px;font-weight:700;font-size:14px;margin-top:6px}
.hp-tbl{overflow-x:auto;margin-bottom:4px}
.hp-tbl table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums;min-width:560px}
.hp-tbl th{text-align:right;font-weight:600;color:var(--muted);font-size:12.5px;padding:6px 10px;border-bottom:2px solid var(--navy)}
.hp-tbl th:first-child,.hp-tbl td:first-child{text-align:left}
.hp-tbl td{text-align:right;padding:7px 10px;border-bottom:1px solid #eef0f4}
.hp-tbl .pp{display:inline-flex;align-items:center;gap:8px}
.hp-tbl tbody tr[data-hold]{cursor:pointer}
.hp-tbl tbody tr[data-hold]:hover{background:#f6f8fb}
.hp-tbl tbody tr.on{background:#eef3fb}
.hp-tbl tbody tr.on td:first-child{font-weight:600;color:var(--accent)}
.hp-tbl tr.na td{color:var(--muted);text-align:left}
.pbar{display:inline-block;width:90px;height:7px;border-radius:999px;background:#fde2e2;overflow:hidden}
.pbar i{display:block;height:100%;background:#16a34a}
.hp-say{font-size:13.5px;line-height:1.6;margin-top:4px}
.tab:disabled{opacity:.35;cursor:not-allowed}
.eq{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px 12px;margin-top:14px}
.eq-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.eq-head h3{font-family:var(--head);font-size:17px;margin:0;color:var(--navy)}
.eq-ctl{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px;color:var(--muted)}
.eq-ctl label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.eq-ctl input{accent-color:var(--navy)}
.eq-legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink);margin:2px 0 6px}
.eq-legend span{display:inline-flex;align-items:center;gap:6px}
.eq-legend i{display:inline-block;width:18px;height:0;border-top:2.5px solid}
.eq-legend i.thin{border-top-width:1.5px}
.eq-legend i.box{width:14px;height:10px;border:0}
.eq-wrap{position:relative}
.eq svg{display:block;width:100%;height:auto;overflow:visible}
.eq-sub{font-family:var(--head);font-size:13px;color:var(--navy);font-weight:600;margin:10px 0 2px}
.eq-tip{position:absolute;pointer-events:none;background:var(--navy);color:#fff;border-radius:6px;padding:6px 9px;font-size:12px;line-height:1.5;white-space:nowrap;transform:translate(-50%,-100%);font-variant-numeric:tabular-nums}
.eq-tip[hidden]{display:none}
.form{display:grid;gap:16px;min-width:0}
.inlayout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start;max-width:1320px}
@media (max-width:980px){.inlayout{grid-template-columns:minmax(0,1fr)}}
.step-note{margin-left:auto;font-size:12.5px;color:var(--muted)}
.amtrow{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center}
.money{display:inline-flex;align-items:center;gap:6px;font-size:16px;color:var(--muted)}
.money input{font-family:var(--head);font-size:28px;font-weight:600;width:150px;text-align:center;border:1.5px solid var(--line);border-radius:10px;padding:7px 8px;color:var(--ink);font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.money input::-webkit-inner-spin-button,.money input::-webkit-outer-spin-button,.wbox input::-webkit-inner-spin-button,.wbox input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.money .unit{margin-left:6px}
.stepbtn{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:20px;cursor:pointer;color:var(--navy)}
.stepbtn:hover,.mini:hover{border-color:var(--navy)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:500;color:var(--navy)}
.chip:hover{border-color:var(--navy)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.ghostchip{color:var(--muted)}
.baht{margin-top:6px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-height:1em}
.plans{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.plans .plan .pnum{padding-right:22px}
@media (max-width:1180px){.plans{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){.plans{grid-template-columns:minmax(0,1fr)}}
.plan{display:flex;flex-direction:column;align-items:stretch;gap:3px;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;cursor:pointer;min-width:0;position:relative}
.plan:hover{border-color:#9aa6bb}
.plan[aria-checked="true"]{border-color:var(--navy);box-shadow:inset 0 0 0 1.5px var(--navy);background:#f6f8fb}
.plan[aria-checked="true"]::after{content:'✓';position:absolute;top:10px;right:12px;width:20px;height:20px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;display:grid;place-items:center}
.plan.diy{border-style:solid}
.plan.hero{width:100%;padding:16px 18px;border-width:2px}
.plan.hero .pname{font-size:19px}
.plan.hero .prisk{font-size:13px}
.plan.hero[aria-checked="false"]{border-color:var(--accent);border-style:dashed}
.dtag{background:var(--navy);color:#fff;font-size:11.5px;font-weight:700;letter-spacing:.5px;border-radius:5px;padding:2px 7px}
.orline{display:flex;align-items:center;gap:10px;margin:16px 0 10px;font-size:12.5px;color:var(--muted)}
.orline::before,.orline::after{content:'';flex:1;height:1px;background:var(--line)}
.plans .plan{padding:12px 14px}
.plan .pnum{font-family:var(--head);font-size:15px;font-weight:700;color:var(--navy)}
.plan[aria-checked="true"] .pnum{color:var(--accent)}
.plans .plan .pname{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:0}
.plans .plan .pmix{font-size:12px}
.ptop{display:flex;align-items:center;gap:8px}
.plan .pno{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.3px}
.plan[aria-checked="true"] .pno{color:var(--accent)}
.plan .pname{font-family:var(--head);font-weight:700;font-size:16px;color:var(--navy);line-height:1.2;padding-right:20px}
.plan .prisk{font-size:12.5px;color:var(--muted)}
.plan .pmix{display:grid;grid-template-columns:auto auto;justify-content:start;gap:1px 10px;font-size:12.5px;color:var(--ink);margin-top:6px;line-height:1.45;font-variant-numeric:tabular-nums}
.plan .pmix b{font-weight:600}
.plan .pstat{display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:auto;padding-top:8px;border-top:1px solid #eef0f4;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.plan .pstat b{font-weight:600}
.meter{display:inline-flex;gap:2px;align-items:flex-end;vertical-align:middle}
.meter i{width:5px;height:9px;border-radius:1px;background:#dde2ea}
.meter i:nth-child(2){height:11px}.meter i:nth-child(3){height:13px}.meter i:nth-child(4){height:15px}.meter i:nth-child(5){height:17px}
.meter i.on.l1,.meter i.on.l2{background:#3b9a6b}.meter i.on.l3{background:#d9a21b}.meter i.on.l4,.meter i.on.l5{background:#d6453d}
.lbl{font-size:13px;color:var(--muted);margin-bottom:6px}
.seg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
@media (max-width:760px){.seg{grid-template-columns:repeat(2,minmax(0,1fr))}}
.seg button{display:flex;flex-direction:column;align-items:center;gap:4px;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 6px;cursor:pointer;font-size:12.5px;color:var(--ink);text-align:center;line-height:1.25}
.seg button[aria-checked="true"]{border-color:var(--navy);box-shadow:inset 0 0 0 1.5px var(--navy);background:#f6f8fb;font-weight:600}
.alloc{display:flex;align-items:center;gap:12px;margin:14px 0 4px}
.alloc-bar{flex:1;height:10px;background:#e6e9ef;border-radius:999px;overflow:hidden}
.alloc-bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .2s}
.alloc-bar i.done{background:var(--pos)} .alloc-bar i.over{background:var(--neg)}
.alloc-txt{font-size:13.5px;white-space:nowrap}
.drow2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:7px 0;border-bottom:1px solid #eef0f4}
.drow2 .nm{display:flex;flex-direction:column;min-width:0}
.drow2 .nm b{font-weight:600}
.drow2 .nm small{font-size:11.5px;color:var(--muted)}
.drow2.on .nm b{color:var(--accent)}
.wbox{display:inline-flex;align-items:center;gap:4px}
.wbox input{width:56px;border:1px solid var(--line);border-radius:6px;padding:5px 4px;text-align:center;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.pctsign{font-size:13px;color:var(--muted)}
.mini{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--navy);font-size:15px;line-height:1}
.drow2 .amt{grid-column:1/-1;text-align:right;font-size:12px;color:var(--muted)}
.drow2 .amt:empty{display:none}
.drow2.low .amt{color:var(--neg);font-weight:600}
.drow2.low .wbox input{border-color:var(--neg)}
.sumcard{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.sum-h{font-family:var(--head);font-weight:700;font-size:15px;color:var(--muted);letter-spacing:.3px}
.sum-plan{display:flex;flex-direction:column;gap:2px}
.sum-plan .pno{font-size:12px;font-weight:600;color:var(--accent)}
.sum-plan b{font-family:var(--head);font-size:18px;color:var(--navy)}
.sum-risk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.sum-main{display:flex;align-items:center;gap:14px}
.mdonut{width:92px;height:92px;flex:0 0 auto}
.sum-amt{font-family:var(--head);font-size:30px;font-weight:700;color:var(--navy);line-height:1;font-variant-numeric:tabular-nums}
.sum-list{display:flex;flex-direction:column;gap:4px;font-size:13px;font-variant-numeric:tabular-nums}
.sum-list>div{display:grid;grid-template-columns:12px 1fr auto auto;gap:8px;align-items:center}
.sum-list>div.muted{display:block}
.sum-list i{width:10px;height:10px;border-radius:2px;display:inline-block}
.sum-list span{text-align:right;color:var(--muted)}
.sum-list span:last-child{min-width:62px}
.sum-list .low span{color:var(--neg);font-weight:600}
.btn.full{width:100%}
.period{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.periodwrap{flex:1 1 640px;min-width:0}
.period-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.period-h span{font-size:12.5px;color:var(--muted)}
.period-h b{font-family:var(--head);font-size:16px;color:var(--navy);font-variant-numeric:tabular-nums}
.period-h em{font-style:normal;font-size:12px;color:#fff;background:var(--navy);border-radius:999px;padding:1px 8px}
.period-opts{display:flex;flex-wrap:wrap;gap:6px}
.period-opts button{display:inline-flex;flex-direction:column;align-items:center;border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:5px 11px;cursor:pointer;font-size:13px;color:var(--navy);line-height:1.2}
.period-opts button small{font-size:10.5px;color:var(--muted)}
.period-opts button:hover{border-color:var(--navy)}
.period-opts button[aria-checked="true"]{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.period-opts button[aria-checked="true"] small{color:#c9d2e3}
.period-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.period-custom{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13px;color:var(--muted);padding-left:14px;border-left:1.5px solid var(--line)}
[hidden]{display:none !important}
.period-custom input{border:1.5px solid var(--line);border-radius:8px;padding:5px 8px;color:var(--ink)}
.period.compact{padding:10px;border-radius:10px}
.period.compact .period-h b{font-size:14px}
.period.compact .period-opts button{padding:4px 8px;font-size:12px}
.printonly{display:none}
.dlmenu{position:relative}
.dlpanel{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border-radius:10px;box-shadow:0 10px 28px rgba(22,35,58,.2);padding:6px;z-index:20;min-width:230px;display:flex;flex-direction:column}
.dlpanel button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:0;background:none;text-align:left;padding:8px 10px;border-radius:7px;cursor:pointer;color:var(--ink)}
.dlpanel button:hover{background:#f3f5f9}
.dlpanel b{font-weight:600;color:var(--navy)}
.dlpanel small{font-size:12px;color:var(--muted)}
.secimg{border:1px solid var(--line);background:#fff;border-radius:7px;padding:3px 9px;font-size:12px;color:var(--navy);cursor:pointer;white-space:nowrap}
.secimg:hover{border-color:var(--navy)}
.sechead{display:flex;justify-content:space-between;align-items:center;margin:0 0 6px;font-size:13px;color:var(--muted)}
body.capturing .noprint,body.capturing .eq-tip{display:none !important}
body.capturing #secEq,body.capturing #secMed{padding:16px 18px 18px;background:#fff}
body.capturing #secMed .eq-head{margin-top:0 !important}
body.capturing .printonly{display:block}
body.capturing span.printonly{display:inline-block}
body.capturing .print-head.printonly{display:flex;padding:4px 2px 6px;background:#fff}

.print-head{justify-content:space-between;align-items:baseline;gap:12px;border-bottom:3px solid var(--navy);padding-bottom:6px;margin-bottom:10px}
.print-head b{font-family:var(--head);font-size:20px;color:var(--navy)}
.print-head span{color:var(--muted);font-size:13px;margin-left:6px}
.print-head #printMeta{font-size:12px;color:var(--muted)}

<body>
<div class="wrap">
  <div class="topbar">
    <h1>Wealth Plan Portfolio</h1>
    <div class="datainfo" id="datainfo"></div>
  </div>
  <input type="file" id="file" accept=".csv" hidden>
  <div id="app"></div>
</div>

<script>
/* ===== Wealth Plan engine (pure functions) ===== */
const WP = (() => {
  const DAY = 864e5;
  const pad = n => String(n).padStart(2, '0');
  const iso = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
  const toTime = s => Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10));
  const daysBetween = (a, b) => Math.round((toTime(b) - toTime(a)) / DAY);
  // Excel EDATE: same day n months later, clamped to month end
  function edate(s, months) {
    let y = +s.slice(0, 4), m = +s.slice(5, 7) - 1 + months, d = +s.slice(8, 10);
    y += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
    const last = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
    return iso(y, m + 1, Math.min(d, last));
  }

  /* ---------- CSV: Model Performance export ---------- */
  function splitCSVLine(line) {
    const out = []; let cur = '', q = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (q) { if (ch === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
      else if (ch === '"') q = true;
      else if (ch === ',') { out.push(cur); cur = ''; }
      else cur += ch;
    }
    out.push(cur); return out;
  }
  function parseDateAny(s) {
    s = s.trim();
    let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);           // m/d/yyyy
    if (m) return iso(+m[3], +m[1], +m[2]);
    m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return iso(+m[1], +m[2], +m[3]);
    const t = Date.parse(s + ' UTC');
    if (!isNaN(t)) { const d = new Date(t); return iso(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate()); }
    return null;
  }
  function parseModelCSV(text) {
    text = text.replace(/^﻿/, '');
    const lines = text.split(/\r?\n/).filter(l => l.trim());
    const head = splitCSVLine(lines[0]).map(h => h.trim().toLowerCase());
    const iModel = head.indexOf('model name');
    let iDate = head.indexOf('date'); if (iDate < 0) iDate = head.indexOf('day of date');
    const iVal = head.findIndex(h => h.includes('difference'));
    if (iModel < 0 || iDate < 0 || iVal < 0) throw new Error('ไม่พบคอลัมน์ Model Name / date / % Difference in port_value ในไฟล์ CSV');
    const rows = {}; const dset = new Set();
    for (let k = 1; k < lines.length; k++) {
      const c = splitCSVLine(lines[k]);
      const model = (c[iModel] || '').trim(), d = parseDateAny(c[iDate] || '');
      const v = parseFloat(String(c[iVal]).replace('%', '').replace(/,/g, ''));
      if (!model || !d || isNaN(v)) continue;
      (rows[model] = rows[model] || {})[d] = 1 + v / 100;
      dset.add(d);
    }
    const dates = [...dset].sort();
    const models = {};
    Object.keys(rows).forEach(m => { models[m] = dates.map(d => rows[m][d] ?? null); });
    return { dates, models };
  }

  /* ---------- XLSX: recovery_cycle_stats 'nav' sheet (plan1..plan5) ---------- */
  function parseNavSheet(aoa, serialToISO) {
    const head = aoa[0].map(h => String(h ?? '').trim().toLowerCase());
    const cols = {};
    head.forEach((h, i) => { if (/^plan[1-5]$/.test(h) && cols[h] == null) cols[h] = i; });
    if (!cols.plan1 || !cols.plan5) throw new Error('ไม่พบคอลัมน์ plan1 / plan5 ใน sheet "nav"');
    const dates = [], plans = { plan1: [], plan5: [] };
    for (let r = 1; r < aoa.length; r++) {
      const row = aoa[r]; if (!row || row[0] == null || row[0] === '') continue;
      const d = typeof row[0] === 'number' ? serialToISO(row[0]) : parseDateAny(String(row[0]));
      if (!d) continue;
      dates.push(d);
      ['plan1', 'plan5'].forEach(p => { const v = row[cols[p]]; plans[p].push(typeof v === 'number' ? v : null); });
    }
    return { dates, plans };
  }

  /* ---------- back out pre-inception TDP / TCT from plan NAVs ---------- */
  // plan1 = 80% FIXEDSP + 20% FIXEDTDP ; plan5 = 50% AAA + 50% TCT (buy-and-hold from 2019-04-01)
  const BACKOUT = {
    FIXEDTDP: { plan: 'plan1', known: { FIXEDSP: 0.8 }, w: 0.2 },
    TCT:      { plan: 'plan5', known: { AAA: 0.5 },     w: 0.5 },
  };
  function deriveBackfill(csv, nav) {
    const cIdx = new Map(csv.dates.map((d, i) => [d, i]));
    const out = {};
    for (const [model, spec] of Object.entries(BACKOUT)) {
      const series = csv.models[model];
      const inc = series ? csv.dates[series.findIndex(v => v != null)] : null;
      const pts = [];
      nav.dates.forEach((d, i) => {
        const pv = nav.plans[spec.plan][i], ci = cIdx.get(d);
        if (pv == null || ci == null) return;
        const kv = Object.keys(spec.known).map(k => csv.models[k] && csv.models[k][ci]);
        if (kv.some(v => v == null)) return;
        pts.push({ d, pv, kv });
      });
      const dates = [], lv = [], p0 = pts[0];
      for (let i = 0; i < pts.length; i++){
        if (inc && i > 0 && pts[i - 1].d >= inc) break;            // only needed up to inception
        let k = pts[i].pv / p0.pv; Object.values(spec.known).forEach((w, j) => { k -= w * pts[i].kv[j] / p0.kv[j]; });
        dates.push(pts[i].d); lv.push(k / spec.w);
      }
      out[model] = { dates, lv, inception: inc };
    }
    return out;
  }

  /* ---------- full per-model level series on the CSV date grid ---------- */
  function buildFull(csv, backfill) {
    const models = {};
    for (const [m, s] of Object.entries(csv.models)) {
      const arr = s.slice();
      const bf = backfill && backfill[m];
      const incI = arr.findIndex(v => v != null);
      if (bf && incI > 0) {
        const incD = csv.dates[incI];
        const at = d => { let lo = 0, hi = bf.dates.length - 1, k = -1;      // last bf date <= d
          while (lo <= hi) { const mid = (lo + hi) >> 1; if (bf.dates[mid] <= d) { k = mid; lo = mid + 1; } else hi = mid - 1; }
          return k < 0 ? null : bf.lv[k]; };
        const bInc = at(incD);
        for (let i = 0; i < incI; i++) {
          if (csv.dates[i] < bf.dates[0]) continue;
          const b = at(csv.dates[i]); if (b != null && bInc) arr[i] = b / bInc * arr[incI];
        }
      }
      models[m] = arr;
    }
    return { dates: csv.dates, models };
  }
  function firstDate(full, m) { const s = full.models[m]; const i = s ? s.findIndex(v => v != null) : -1; return i < 0 ? null : full.dates[i]; }

  /* ---------- portfolio: buy-and-hold (weights set at the start, no rebalancing) ----------
     matches the research workbook: value(t) = sum_i w_i * level_i(t) / level_i(start) */
  function portfolio(full, weights, start, end){
    const ms = Object.keys(weights).filter(m => weights[m] > 0);
    const dates = [], nav = []; let i0 = -1;
    for (let i = 0; i < full.dates.length; i++){
      const d = full.dates[i];
      if (d < start || d > end) continue;
      if (ms.some(m => full.models[m][i] == null)) continue;
      if (i0 < 0) i0 = i;
      let v = 0; ms.forEach(m => { v += weights[m] * full.models[m][i] / full.models[m][i0]; });
      dates.push(d); nav.push(v);
    }
    const b = nav[0]; return { dates, nav: nav.map(v => v / b) };
  }

  /* ---------- metrics ---------- */
  function rolling1y(s) {   // NAV(d) / NAV(EDATE(d,-12), or nearest earlier) - 1
    const out = []; let j = 0;
    for (let i = 0; i < s.dates.length; i++) {
      const t = edate(s.dates[i], -12);
      if (t < s.dates[0]) continue;
      while (j + 1 < s.dates.length && s.dates[j + 1] <= t) j++;
      out.push({ d: s.dates[i], r: s.nav[i] / s.nav[j] - 1 });
    }
    return out;
  }
  // desk method: every day is a possible entry; a cycle = entry whose value is breached by
  // >= threshold within 84 rows; drawdown = trough vs entry; recovery = days until back to entry
  function cycles(s, thr, W = 84) {
    const v = s.nav, d = s.dates, n = v.length, out = [];
    for (let i = 0; i < n; i++) {
      const jEnd = Math.min(n - 1, i + W); if (i + 1 > jEnd) continue;
      const br = v[i] * (1 - thr); let j = -1;
      for (let x = i + 1; x <= jEnd; x++) if (v[x] <= br) { j = x; break; }
      if (j < 0) continue;
      let k = -1; for (let x = j + 1; x < n; x++) if (v[x] >= v[i]) { k = x; break; }
      const active = k < 0; if (active) k = n - 1;
      let mn = Infinity; for (let x = i; x <= k; x++) if (v[x] < mn) mn = v[x];
      let ti = i; for (let x = i; x <= k; x++) if (v[x] < v[ti]) ti = x;
      out.push({ i, k, ti, dd: mn / v[i] - 1, days: daysBetween(d[i], d[k]), active });
    }
    return out;

      recMedian: median(rec),
      recLongest: cyc.length ? Math.max(...cyc.map(c => c.days)) : null,

function compute(){

/* ---------- suggest a DIY mix: target 1Y avg return, max drawdown limit ---------- */
function suggestMixes(target, ddLimit, amt){
  const ms = MODEL_ORDER.filter(m => FULL.models[m]);
  const idx = []; for (let i = 0; i < FULL.dates.length; i++){ const d = FULL.dates[i]; if (d < state.start || d > state.end) continue; if (ms.every(m => FULL.models[m][i] != null)) idx.push(i); }
  const n = idx.length; if (n < 300) return [];
  const dates = idx.map(i => FULL.dates[i]);
  const L = ms.map(m => { const a = FULL.models[m], b = a[idx[0]]; return Float64Array.from(idx, i => a[i] / b); });
  const back = new Int32Array(n).fill(-1); { let j = 0; for (let i = 0; i < n; i++){ const t0 = WP.edate(dates[i], -12); if (t0 < dates[0]) continue; while (j + 1 < n && dates[j + 1] <= t0) j++; back[i] = j; } }
  const years = WP.daysBetween(dates[0], dates[n - 1]) / 365.25;
  const minW = Math.max(10, Math.ceil(MIN_PER_MODEL / amt * 100 / 10) * 10);   // 10% steps, >= 5 แสน per model
  const out = [], V = new Float64Array(n), w = new Array(ms.length).fill(0);
  const evalMix = () => {
    V.fill(0); for (let k = 0; k < ms.length; k++) if (w[k]){ const f = w[k] / 100, Lk = L[k]; for (let i = 0; i < n; i++) V[i] += f * Lk[i]; }
    let pk = 0, mdd = 0, s = 0, c = 0;
    for (let i = 0; i < n; i++){ if (V[i] > pk) pk = V[i]; const d = V[i] / pk - 1; if (d < mdd) mdd = d; if (back[i] >= 0){ s += V[i] / V[back[i]] - 1; c++; } }
    let dy = 0; for (let k = 0; k < ms.length; k++) dy += (DIV_YIELD[ms[k]] || 0) * w[k] / 100;
    out.push({w: Object.fromEntries(ms.map((m, k) => [m, w[k]]).filter(x => x[1] > 0)), avg: s / c + dy, total: V[n - 1] - 1 + dy * years, mdd, k: w.filter(x => x).length});
  };
  const rec = (k, left, used) => {
    if (left === 0){ evalMix(); return; }
    if (k === ms.length || used === 4) return;
    for (let x = left; x >= minW; x -= 10){ if (left - x !== 0 && left - x < minW) continue; w[k] = x; rec(k + 1, left - x, used + 1); }
    w[k] = 0; rec(k + 1, left, used);
  };
  rec(0, 100, 0);
  const ok = out.filter(o => o.mdd >= -ddLimit);
  const score = o => Math.abs(o.avg - target);
  const pick = (ok.length ? ok : out).sort((a, b) => ok.length ? (score(a) - score(b)) || (b.mdd - a.mdd) || (a.k - b.k) : (b.mdd - a.mdd));
  const res = [], seen = new Set();
  for (const o of pick){ const key = Object.keys(o.w).sort().join(); if (seen.has(key)) continue; seen.add(key); res.push(o); if (res.length === 3) break; }
  return {fits: ok.length > 0, list: res, from: dates[0], to: dates[n - 1]};
}

function setPeriod(id){
  state.period = id; const p = PERIODS.find(x => x.id === id);
  if (p && p.range){ [state.start, state.end] = p.range(); if (state.start < firstDate()) state.start = firstDate(); }

function periodHTML(compact){
  const yrs = WP.daysBetween(state.start, state.end) / 365.25, cur = state.period || 'all';

function bindPeriod(root, onChange){
  root.querySelectorAll('[data-period]').forEach(b => b.onclick = () => { setPeriod(b.dataset.period); onChange(); });
  const s = root.querySelector('.pStart'), e = root.querySelector('.pEnd');
  if (s) s.onchange = () => { if (s.value && s.value < state.end){ state.start = s.value; onChange(); } };
  if (e) e.onchange = () => { if (e.value && e.value > state.start){ state.end = e.value; onChange(); } };
}

const fmtMoney = x => x.toLocaleString('en-US', {maximumFractionDigits: 2});
const fmtNum = x => (Math.round(x*100)/100).toString();

function colorsFor(models, raw){
  // largest weight -> blue, the rest in order: grey, navy, light ...
  const big = models.reduce((b,m) => (+raw[m] > +raw[b] ? m : b), models[0]);
  const rest = ['#a5adbf','#2b4167','#dbe7f7','#7aa5d8','#5b6474','#c8ced9','#8fa0bb'];
  const out = {}; let k = 0;
  models.forEach(m => { out[m] = m === big ? '#3b7cc4' : rest[k++ % rest.length]; });
  return out;
}

function slideHTML(plan, r){
  const meta = planMeta(plan);
  const models = r.models;
  if (!models.length) return `<div class="s-msg">ใส่ % ของโมเดลในแผงด้านขวา</div>`;
  const col = colorsFor(models, r.raw);
  const titleBlock = `<div class="s-title"><div class="n">${esc(meta.name)}</div>${meta.risk ? `<div class="r">- Risk Profile: ${esc(meta.risk)} -</div>` : ''}</div>`;
  if (Math.abs(r.sum-100) > 1e-6) return `<div class="s-msg">สัดส่วนรวม ${fmtNum(r.sum)}% — ต้องเท่ากับ 100% ถึงจะคำนวณได้</div>`;
  if (r.missing) return `<div class="s-msg">ไม่มีข้อมูลของ ${r.missing.join(', ')} ในไฟล์ CSV</div>`;
  if (r.short) return `<div class="s-msg">ช่วงข้อมูลสั้นเกินไป ลองขยายช่วงวันที่</div>`;
  const yrs = Math.max(1, Math.floor(r.years + 0.02)), p = r.port;
  // strategy groups (rowspan for consecutive same strategy)
  const rows = r.rows.map((row,i) => {
    const s = MODEL_INFO[row.m].strategy, prev = i ? MODEL_INFO[r.rows[i-1].m].strategy : null;
    let span = 0; if (s !== prev){ span = 1; while (i+span < r.rows.length && MODEL_INFO[r.rows[i+span].m].strategy === s) span++; }
    return `<tr>
      ${span ? `<td class="strat${i + span === r.rows.length ? ' end' : ''}" rowspan="${span}">${esc(s).replace(' With', '<br>With').replace('Max ', 'Max<br>').replace('Stabilizer', '<br>Stabilizer').replace(/^Core <br>/, 'Core<br>').replace('Engine','<br>Engine').replace('Growth <br>','Growth<br>')}</td>` : ''}
      <td class="model"><i style="background:${col[row.m]}"></i>${row.m}</td>
      <td class="${cls(row.st.total)}">${row.div ? pct(row.st.total + row.div.total) + `<span class="dv">(ปันผล ${pct(row.div.total)})</span>` : pct(row.st.total)}</td>
      <td class="${cls(row.st.rollAvg)}">${row.div ? pct(row.st.rollAvg + row.div.avg) + `<span class="dv">(ปันผล ${pct(row.div.avg)})</span>` : pct(row.st.rollAvg)}</td>
      <td class="${cls(row.st.maxDD)}">${pct(row.st.maxDD, {dp: Math.abs(row.st.maxDD) < 0.001 ? 2 : 1})}</td>
      <td>${recShort(row.st.recLongest)}</td></tr>`;
  }).join('');
  const rec1 = recLong(p.recMedian), rec2 = recLong(p.recLongest);
  return `
    <svg class="s-donut" viewBox="0 0 500 420" aria-label="สัดส่วนพอร์ต">${donut(models, r.raw, col)}</svg>
    <div class="s-legend">${models.map(m => `<span><i style="background:${col[m]}"></i>${m}</span>`).join('')}</div>
    <div class="s-table">
      ${titleBlock}

function donut(models, raw, col){
  const amt = parseFloat(state.amount) || 0;
  const cx = 250, cy = 210, R = 146, r = 112, total = models.reduce((a,m) => a + (+raw[m]||0), 0);
  let a0 = -Math.PI/2, out = '';
  const pt = (rad, a) => [cx + rad*Math.cos(a), cy + rad*Math.sin(a)];
  const labels = [];
  models.forEach(m => {
    const v = +raw[m] || 0; if (v <= 0) return;
    const a1 = a0 + v/total*2*Math.PI, large = a1 - a0 > Math.PI ? 1 : 0;
    if (v >= total - 1e-9){
      out += `<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="${col[m]}" stroke-width="${R-r}"/>`;
    } else {
      const [x1,y1] = pt(R,a0), [x2,y2] = pt(R,a1), [x3,y3] = pt(r,a1), [x4,y4] = pt(r,a0);
      out += `<path d="M${x1},${y1} A${R},${R} 0 ${large} 1 ${x2},${y2} L${x3},${y3} A${r},${r} 0 ${large} 0 ${x4},${y4}Z" fill="${col[m]}" stroke="#fff" stroke-width="1.5"/>`;
    }
    labels.push({m, v, am:(a0+a1)/2}); a0 = a1;
  });
  // labels with leader lines; spread labels on each side so they never overlap
  const gap = amt > 0 ? 58 : 44, top = 30, bottom = amt > 0 ? 362 : 380;
  labels.forEach(L => { L.right = Math.cos(L.am) >= 0; L.ly = cy + (R + 22) * Math.sin(L.am); });
  [true, false].forEach(side => {
    const g = labels.filter(L => L.right === side).sort((a, b) => a.ly - b.ly);
    for (let i = 0; i < g.length; i++) g[i].ly = Math.max(g[i].ly, i ? g[i-1].ly + gap : top);
    const over = g.length ? g[g.length-1].ly - bottom : 0;
    if (over > 0) g.forEach(L => L.ly -= over);
    for (let i = g.length - 2; i >= 0; i--) g[i].ly = Math.min(g[i].ly, g[i+1].ly - gap);
  });
  labels.forEach(L => {
    const right = L.right, ly = L.ly;
    const [sx,sy] = pt((R+r)/2, L.am);
    const lx = right ? cx + R + 28 : cx - R - 28;
    out += `<polyline points="${sx},${sy} ${lx + (right?-6:6)},${ly}" fill="none" stroke="#9aa3b2" stroke-width="1"/>`;
    const tx = lx, anchor = right ? 'start' : 'end';
    out += `<text x="${tx}" y="${ly-10}" text-anchor="${anchor}" font-size="14" font-weight="600" fill="#16233a">${L.m}</text>`;
    out += `<text x="${tx}" y="${ly+14}" text-anchor="${anchor}" font-size="22" font-weight="600" fill="#16233a">${fmtNum(L.v)}%</text>`;
    if (amt > 0) out += `<text x="${tx}" y="${ly+33}" text-anchor="${anchor}" font-size="14" font-weight="500" fill="#5b6474">${fmtMoney(amt*L.v/total)} ล้านบาท</text>`;
  });
  out += `<text x="${cx}" y="${cy-48}" text-anchor="middle" font-size="19" font-weight="500" fill="#16233a">Portfolio Value</text>`;
  if (amt > 0){
    out += `<text x="${cx}" y="${cy+18}" text-anchor="middle" font-size="${fmtMoney(amt).length > 7 ? 40 : 52}" font-weight="700" fill="#16233a">${fmtMoney(amt)}</text>`;
    out += `<text x="${cx}" y="${cy+62}" text-anchor="middle" font-size="24" font-weight="600" fill="#16233a">ล้านบาท</text>`;
  } else out += `<text x="${cx}" y="${cy+66}" text-anchor="middle" font-size="24" font-weight="600" fill="#16233a">ล้านบาท</text>`;
  return out;
}

/* ================= holding-period returns (month-end observations) ================= */
const HOLD_ALL = [['3M', 3], ['6M', 6], ...Array.from({length: 15}, (_, i) => [(i + 1) + 'Y', (i + 1) * 12])];
const HOLD_TH = Object.fromEntries(HOLD_ALL.map(([k, m]) => [k, m < 12 ? m + ' เดือน' : m / 12 + ' ปี']));
function holdingMonthly(s, months){
  const me = []; for (let i = 0; i < s.dates.length; i++){ const nx = s.dates[i + 1]; if (!nx || nx.slice(0, 7) !== s.dates[i].slice(0, 7)) me.push(i); }
  const out = []; for (let k = months; k < me.length; k++) out.push({d: s.dates[me[k]], r: s.nav[me[k]] / s.nav[me[k - months]] - 1});
  return out;
}
function drawHolding(r){

    const d = pos + neg || 1; return {n: rows.length, pPos: pos / d, pNeg: neg / d, avg: sm / rows.length, mn, mx}; };
  const all = HOLD_ALL.map(([k, m]) => { const rows = holdingMonthly(s, m); return {k, m, rows, st: sumOf(rows)}; }).filter(o => o.st);

/* ================= equity curve + drawdown ================= */
const EQ = {models:false};
function niceStep(range, n){ const raw = range / n, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p; return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p; }
function drawEquity(r){
  const box = document.getElementById('eq'); if (!box) return;
  if (!r.port || !r.pf){ box.hidden = true; return; }
  box.hidden = false;
  const pf = r.pf, n = pf.dates.length;
  const col = colorsFor(r.models, r.raw);
  // per-model series on the portfolio's dates, rebased at start
  const series = [{key:'port', name: 'พอร์ต', color:'var(--navy)', w:2.6, v: pf.nav.map(x => x / pf.nav[0] - 1)}];
  if (EQ.models) r.models.forEach(m => {
    const s = WP.portfolio(FULL, {[m]:1}, r.start, r.end), map = new Map(s.dates.map((d,i) => [d, s.nav[i] / s.nav[0] - 1]));
    series.push({key:m, name:m, color: col[m] === '#dbe7f7' ? '#9bb8de' : col[m], w:1.4, v: pf.dates.map(d => map.get(d) ?? null)});
  });
  // drawdown (underwater) of the portfolio
  let pk = -Infinity; const dd = pf.nav.map(x => { if (x > pk) pk = x; return x / pk - 1; });
  let mi = 0; dd.forEach((x,i) => { if (x < dd[mi]) mi = i; });
  let pi = mi; while (pi > 0 && dd[pi] < 0) pi--;
  // back-filled stretch (latest inception among used models that lean on backfill)
  const bfEnd = r.backfilled.length ? r.backfilled.map(b => b.from).sort().pop() : null;

  const W = 1100, padL = 56, padR = 18, H1 = 300, H2 = 190, padT = 12, padB = 26, ddRoom = 30;
  const x = i => padL + (W - padL - padR) * i / (n - 1);
  const all = series.flatMap(s => s.v).filter(v => v != null);
  let lo = Math.min(0, ...all), hi = Math.max(0, ...all);
  const st = niceStep(hi - lo || 0.01, 5); lo = Math.floor(lo / st) * st; hi = Math.ceil(hi / st) * st;
  const y1 = v => padT + (H1 - padT - padB) * (hi - v) / (hi - lo);
  const ddLo0 = Math.min(...dd), st2 = niceStep(-ddLo0 || 0.001, 3), ddLo = Math.floor(ddLo0 / st2) * st2 || -st2;
  const y2 = v => padT + (H2 - padT - padB - ddRoom) * (0 - v) / (0 - ddLo);
  const pctTick = (v, s) => { const d = s * 100 < 1 ? (s * 100 < 0.1 ? 2 : 1) : 0; return (v > 0 ? '+' : '') + (v * 100).toFixed(d) + '%'; };
  const years = []; let lastY = null; pf.dates.forEach((d,i) => { const yy = d.slice(0,4); if (yy !== lastY){ if (lastY && d.slice(5,7) === '01') years.push({i, yy}); lastY = yy; } });
  const grid = (H, yf, ticks, s) => ticks.map(v => `<line x1="${padL}" x2="${W-padR}" y1="${yf(v)}" y2="${yf(v)}" stroke="${Math.abs(v) < 1e-12 ? '#8b93a3' : '#e6e9ef'}" stroke-width="1"/><text x="${padL-8}" y="${yf(v)+4}" text-anchor="end" font-size="11.5" fill="#6a7488">${pctTick(v, s)}</text>`).join('')
    + years.map(o => `<line x1="${x(o.i)}" x2="${x(o.i)}" y1="${padT}" y2="${H-padB}" stroke="#eef0f4"/><text x="${x(o.i)}" y="${H-8}" text-anchor="middle" font-size="11.5" fill="#6a7488">${o.yy}</text>`).join('');
  const ticks = (a, b, s) => { const o = []; for (let v = a; v <= b + 1e-12; v += s) o.push(+v.toFixed(10)); return o; };
  const path = (v, yf) => { let s = '', pen = false; v.forEach((val,i) => { if (val == null){ pen = false; return; } s += (pen ? 'L' : 'M') + x(i).toFixed(1) + ',' + yf(val).toFixed(1); pen = true; }); return s; };
  const bfI = bfEnd ? pf.dates.findIndex(d => d >= bfEnd) : -1;
  const bfRect = (H, label) => bfI > 0 ? `<g class="noprint"><rect x="${padL}" y="${padT}" width="${x(bfI)-padL}" height="${H-padT-padB}" fill="#f2f4f8"/>${label ? `<text x="${padL+8}" y="${padT+14}" font-size="11" fill="#8b93a3">ช่วงใช้ผลทดสอบย้อนหลัง</text>` : ''}</g>` : '';
  // max drawdown episode: peak -> back to that peak (recovery)
  const ri = r.mdd.recovered ? pf.dates.indexOf(r.mdd.rec) : n - 1;
  const recTxt = d => { const q = recLong(d); return q.v + ' ' + (q.u === 'months' ? 'เดือน' : 'ปี'); };
  const mddBand = `<rect x="${x(pi)}" y="${padT}" width="${Math.max(2, x(ri)-x(pi))}" height="${H2-padT-padB}" fill="rgba(227,25,27,.10)"/>`;
  const ay = y2(dd[mi]) + 16, lblRight = x(ri) + 8 + 260 < W - padR;
  const mddLbl = `Max ${pct(dd[mi])} · ${r.mdd.recovered ? 'Recovery ' + recTxt(r.mdd.days) : 'ยังไม่กลับถึงจุดสูงสุดเดิม'}`;
  const mddMark = `<defs><marker id="arw2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--navy)"/></marker></defs>
    <line x1="${x(pi)}" x2="${x(pi)}" y1="${y2(0)}" y2="${ay + 5}" stroke="var(--navy)" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="${x(ri)}" x2="${x(ri)}" y1="${y2(0)}" y2="${ay + 5}" stroke="var(--navy)" stroke-width="1" stroke-dasharray="2 2"/>
    <line x1="${x(pi)}" x2="${x(ri)}" y1="${ay}" y2="${ay}" stroke="var(--navy)" stroke-width="1.5" marker-start="url(#arw2)" ${r.mdd.recovered ? 'marker-end="url(#arw2)"' : ''}/>
    <text x="${lblRight ? x(ri) + 8 : x(pi) - 8}" y="${ay + 4}" text-anchor="${lblRight ? 'start' : 'end'}" font-size="12.5" font-weight="600" fill="var(--navy)" stroke="#fff" stroke-width="4" paint-order="stroke">${mddLbl}</text>`;

  const svg1 = `<svg viewBox="0 0 ${W} ${H1}" id="eqSvg" role="img" aria-label="ผลตอบแทนสะสม">
    ${bfRect(H1, true)}${grid(H1, y1, ticks(lo, hi, st), st)}
    ${series.slice(1).map(s => `<path d="${path(s.v, y1)}" fill="none" stroke="${s.color}" stroke-width="${s.w}" stroke-linejoin="round" opacity=".9"/>`).join('')}
    <path d="${path(series[0].v, y1)}" fill="none" stroke="var(--navy)" stroke-width="2.6" stroke-linejoin="round"/>
    <circle cx="${x(n-1)}" cy="${y1(series[0].v[n-1])}" r="4" fill="var(--navy)"/>
    <text x="${x(n-1)-8}" y="${y1(series[0].v[n-1])-10}" text-anchor="end" font-size="13" font-weight="600" fill="var(--navy)" stroke="#fff" stroke-width="4" paint-order="stroke">${pct(series[0].v[n-1])}</text>
    <line id="eqX1" y1="${padT}" y2="${H1-padB}" stroke="#16233a" stroke-dasharray="3 3" visibility="hidden"/>
  </svg>`;
  const svg2 = `<svg viewBox="0 0 ${W} ${H2}" id="ddSvg" role="img" aria-label="Drawdown">
    ${bfRect(H2, false)}${mddBand}${grid(H2, y2, ticks(ddLo, 0, st2), st2)}
    <path d="${path(dd, y2)}L${x(n-1)},${y2(0)}L${x(0)},${y2(0)}Z" fill="rgba(227,25,27,.18)"/>
    <path d="${path(dd, y2)}" fill="none" stroke="var(--neg)" stroke-width="1.4"/>
    <circle cx="${x(mi)}" cy="${y2(dd[mi])}" r="4" fill="var(--neg)"/>
    ${mddMark}
    <line id="eqX2" y1="${padT}" y2="${H2-padB}" stroke="#16233a" stroke-dasharray="3 3" visibility="hidden"/>
  </svg>`;
  /* ---- where the median comes from: one mark per counted cycle (entry date) ---- */
  const cyc = WP.cycles(pf, r.thr);
  const metric = EQ.metric === 'rec' ? 'rec' : 'dd';
  const tabsHTML = `<div class="tabs noprint" role="group" aria-label="เลือกค่าที่ดู" style="padding:3px">
      <button class="tab" data-metric="dd" aria-pressed="${metric === 'dd'}">Drawdown</button>
      <button class="tab" data-metric="rec" aria-pressed="${metric === 'rec'}">Recovery Period</button></div>`;
  const thrTxt = (r.thr*100).toFixed(3).replace(/0+$/,'').replace(/\.$/,'');
  let cycleHTML = '';
  if (cyc.length){
    const H3 = 190, isDD = metric === 'dd';
    const val = c => isDD ? c.dd : c.days;
    const pool = isDD ? cyc : cyc.filter(c => !c.active);
    const med = isDD ? r.port.cycDDMedian : r.port.recMedian;
    const ext = isDD ? Math.min(...cyc.map(c => c.dd)) : Math.max(...cyc.map(c => c.days));
    let y3, ticks3, fmtT;
    if (isDD){
      const s3 = niceStep(-ext || 0.001, 3), lo3 = Math.floor(ext / s3) * s3;
      y3 = v => padT + (H3 - padT - padB) * (0 - v) / (0 - lo3);
      ticks3 = ticks(lo3, 0, s3); fmtT = v => pctTick(v, s3);
    } else {
      const MD = 30.4375, topM = Math.max(ext / MD, 1);
      const stepM = [1, 2, 3, 6, 12, 24].find(s => topM / s <= 5) || 24, hiM = Math.ceil(topM / stepM) * stepM, hi3 = hiM * MD;
      y3 = v => padT + (H3 - padT - padB) * (hi3 - v) / hi3;
      ticks3 = []; for (let m = 0; m <= hiM; m += stepM) ticks3.push(m * MD);
      fmtT = v => { const m = Math.round(v / MD), yy = Math.floor(m / 12), mm = m % 12; return !m ? '0' : !yy ? m + 'M' : mm ? `${yy}Y ${mm}M` : yy + 'Y'; };
    }
    const g3 = ticks3.map(v => `<line x1="${padL}" x2="${W-padR}" y1="${y3(v)}" y2="${y3(v)}" stroke="${Math.abs(v) < 1e-12 ? '#8b93a3' : '#e6e9ef'}"/><text x="${padL-8}" y="${y3(v)+4}" text-anchor="end" font-size="11.5" fill="#6a7488">${fmtT(v)}</text>`).join('')
      + years.map(o => `<line x1="${x(o.i)}" x2="${x(o.i)}" y1="${padT}" y2="${H3-padB}" stroke="#eef0f4"/><text x="${x(o.i)}" y="${H3-8}" text-anchor="middle" font-size="11.5" fill="#6a7488">${o.yy}</text>`).join('');
    const bw = Math.max(1, (W - padL - padR) / n);
    const bars = cyc.map(c => { const base = isDD ? y3(0) : y3(0), yy = y3(val(c));
      const fill = !isDD && c.active ? '#c3c9d4' : (isDD ? 'rgba(227,25,27,.55)' : 'rgba(31,95,191,.55)');
      return `<rect x="${(x(c.i) - bw/2).toFixed(1)}" y="${Math.min(base, yy).toFixed(1)}" width="${bw.toFixed(2)}" height="${Math.abs(yy - base).toFixed(1)}" fill="${fill}"/>`; }).join('');
    const medY = y3(med), medLbl = isDD ? pct(med) : (recLong(med).v + ' ' + recLong(med).u);
    const extLbl = isDD ? pct(ext) : (recLong(ext).v + ' ' + recLong(ext).u);
    const svg3 = `<svg viewBox="0 0 ${W} ${H3}" id="cySvg" role="img" aria-label="cycle">
      ${bfRect(H3, false)}${g3}${bars}
      <line x1="${padL}" x2="${W-padR}" y1="${medY}" y2="${medY}" stroke="var(--navy)" stroke-width="2" stroke-dasharray="7 4"/>
      <rect x="${W-padR-150}" y="${medY-21}" width="150" height="18" rx="3" fill="var(--navy)"/>
      <text x="${W-padR-75}" y="${medY-8}" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Median ${medLbl}</text>
      <line id="eqX3" y1="${padT}" y2="${H3-padB}" stroke="#16233a" stroke-dasharray="3 3" visibility="hidden"/>
    </svg>`;
    cycleHTML = `<div class="pb-median" id="secMed">
      <div class="eq-head" style="margin-top:18px"><h3>Median Drawdown</h3><span class="eq-ctl">${tabsHTML}</span><span class="printonly ptag">${isDD ? 'Drawdown' : 'Recovery Period'}</span></div>
      <div class="hint printonly" style="margin:0 0 6px">${isDD
        ? `แต่ละแท่ง = ผลขาดทุนสูงสุด หากเข้าลงทุนในวันนั้นแล้วพอร์ตปรับตัวลง · เส้นประ = ค่ามัธยฐาน <b>${medLbl}</b> · ลึกที่สุด ${extLbl}`
        : `แต่ละแท่ง = ระยะเวลาจนมูลค่ากลับมาเท่าวันที่เข้าลงทุน · เส้นประ = ค่ามัธยฐาน <b>${medLbl}</b> · นานที่สุด ${extLbl}`}</div>
      <div class="hint noprint" style="margin:0 0 6px">
        แต่ละแท่ง = 1 cycle คือวันที่ถ้าเข้าลงทุนแล้ว พอร์ตลงเกิน <b>${thrTxt}%</b> ภายใน 84 วันทำการ (≈ 4 เดือน)
        ${isDD ? 'ความสูงแท่ง = จุดต่ำสุดเทียบกับมูลค่าวันที่เข้า' : 'ความสูงแท่ง = จำนวนวันจนมูลค่ากลับมาเท่าวันที่เข้า (แท่งสีเทา = ยังไม่ฟื้น ไม่นับใน Median)'}<br>
        นับได้ <b>${cyc.length.toLocaleString()}</b> cycle${!isDD && pool.length !== cyc.length ? ` (ฟื้นแล้ว ${pool.length.toLocaleString()})` : ''}
        → <b>Median ${medLbl}</b> · ${isDD ? 'ลึกสุด' : 'นานสุด (Longest)'} ${extLbl}
        <span style="color:var(--muted)">· ชี้ที่แท่งเพื่อดูช่วงของ cycle นั้นบน Equity Curve</span></div>
      <div class="eq-wrap" id="cyWrap">${svg3}<div class="eq-tip" id="cyTip" hidden></div></div></div>`;
  } else {
    cycleHTML = `<div class="eq-head" style="margin-top:18px"><h3>Median Drawdown</h3>${tabsHTML}</div><div class="hint">ไม่มีช่วงไหนที่พอร์ตลงเกินเกณฑ์ ${(r.thr*100).toFixed(2)}% ภายใน 84 วันทำการ จึงไม่มี cycle ให้คำนวณ Median</div>`;
  }

  box.innerHTML = `
    <div id="secEq">
    <div class="eq-head"><h3>Equity Curve</h3>
      <div class="eq-ctl"><label class="noprint"><input type="checkbox" id="eqModels" ${EQ.models ? 'checked' : ''}> แสดงแต่ละโมเดล</label>
      <span>${thDate(r.start)} – ${thDate(r.end)}</span></div></div>
    <div class="eq-legend">
      <span><i style="border-color:var(--navy)"></i>พอร์ต<span class="noprint"> (ซื้อแล้วถือ ไม่ปรับสัดส่วน)</span></span>
      ${series.slice(1).map(s => `<span><i class="thin" style="border-color:${s.color}"></i>${s.name}</span>`).join('')}
      ${bfI > 0 ? `<span class="noprint"><i class="box" style="background:#e9ecf2"></i>ช่วงใช้ผลทดสอบย้อนหลัง</span>` : ''}
    </div>
    <div class="eq-wrap" id="eqWrap">${svg1}
      <div class="eq-sub">Drawdown จากจุดสูงสุด · Max Drawdown & Recovery</div>
      <div class="hint" style="margin:0 0 4px">แถบแดง = ช่วง Max Drawdown: จุดสูงสุด ${thDate(r.mdd.peak)} → ต่ำสุด ${thDate(r.mdd.trough)} (<b>${pct(r.mdd.dd)}</b>) → ${r.mdd.recovered ? `กลับถึงจุดสูงสุดเดิม ${thDate(r.mdd.rec)} · <b>Recovery ${recTxt(r.mdd.days)}</b>` : '<b>ยังไม่กลับถึงจุดสูงสุดเดิม</b>'}</div>
      ${svg2}
      <div class="eq-tip" id="eqTip" hidden></div></div>
    </div>
    ${cycleHTML}`;
  box.querySelector('#eqModels').onchange = e => { EQ.models = e.target.checked; drawEquity(r); };
  // hover
  const wrap = box.querySelector('#eqWrap'), tip = box.querySelector('#eqTip');
  const s1 = box.querySelector('#eqSvg'), s2 = box.querySelector('#ddSvg'), l1 = box.querySelector('#eqX1'), l2 = box.querySelector('#eqX2');
  const move = ev => {
    const rc = s1.getBoundingClientRect(), k = rc.width / W;
    const px = (ev.clientX - rc.left) / k; if (px < padL || px > W - padR){ hide(); return; }
    const i = Math.round((px - padL) / (W - padL - padR) * (n - 1));
    [l1, l2].forEach(l => { l.setAttribute('x1', x(i)); l.setAttribute('x2', x(i)); l.setAttribute('visibility', 'visible'); });
    const wr = wrap.getBoundingClientRect();
    tip.hidden = false;
    tip.innerHTML = `<b>${thDate(pf.dates[i])}</b><br>` + series.map(s => `${s.name}: ${pct(s.v[i])}`).join('<br>') + `<br>Drawdown: ${pct(dd[i], {dp: Math.abs(dd[i]) < 0.001 ? 2 : 1})}`;
    tip.style.left = Math.min(Math.max(rc.left - wr.left + x(i) * k, 70), wr.width - 70) + 'px';
    tip.style.top = (rc.top - wr.top + y1(series[0].v[i]) * k - 10) + 'px';
  };
  const hide = () => { tip.hidden = true; [l1, l2].forEach(l => l.setAttribute('visibility', 'hidden')); };
  [s1, s2].forEach(s => { s.addEventListener('mousemove', move); s.addEventListener('mouseleave', hide); });
  box.querySelectorAll('[data-metric]').forEach(bt => bt.onclick = () => { EQ.metric = bt.dataset.metric; drawEquity(r); });
  const s3 = box.querySelector('#cySvg');
  if (s3){
    const tip3 = box.querySelector('#cyTip'), l3 = box.querySelector('#eqX3'), wrap3 = box.querySelector('#cyWrap');
    const byI = new Map(cyc.map(c => [c.i, c]));
    const hl = document.createElementNS('http://www.w3.org/2000/svg', 'g'); s1.insertBefore(hl, s1.querySelector('#eqX1'));
    const hl2 = document.createElementNS('http://www.w3.org/2000/svg', 'g'); s2.insertBefore(hl2, s2.querySelector('#eqX2'));
    const clear = () => { tip3.hidden = true; l3.setAttribute('visibility','hidden'); hl.innerHTML = ''; hl2.innerHTML = ''; };
    s3.addEventListener('mouseleave', clear);
    s3.addEventListener('mousemove', ev => {
      const rc = s3.getBoundingClientRect(), k = rc.width / W, px = (ev.clientX - rc.left) / k;
      if (px < padL || px > W - padR){ clear(); return; }
      let i = Math.round((px - padL) / (W - padL - padR) * (n - 1)), c = null;
      for (let dlt = 0; dlt <= Math.ceil(4 / ((W - padL - padR) / n)) && !c; dlt++) c = byI.get(i + dlt) || byI.get(i - dlt);
      if (!c){ clear(); return; }
      l3.setAttribute('x1', x(c.i)); l3.setAttribute('x2', x(c.i)); l3.setAttribute('visibility','visible');
      const pv = series[0].v, ent = pv[c.i];
      hl.innerHTML = `<rect x="${x(c.i)}" y="${padT}" width="${Math.max(2, x(c.k)-x(c.i))}" height="${H1-padT-padB}" fill="rgba(31,95,191,.10)"/>
        <line x1="${x(c.i)}" x2="${x(c.k)}" y1="${y1(ent)}" y2="${y1(ent)}" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="5 3"/>
        <circle cx="${x(c.i)}" cy="${y1(ent)}" r="4.5" fill="var(--accent)"/>
        <circle cx="${x(c.ti)}" cy="${y1(pv[c.ti])}" r="4.5" fill="var(--neg)"/>
        ${c.active ? '' : `<circle cx="${x(c.k)}" cy="${y1(pv[c.k])}" r="4.5" fill="var(--pos)"/>`}`;
      hl2.innerHTML = `<rect x="${x(c.i)}" y="${padT}" width="${Math.max(2, x(c.k)-x(c.i))}" height="${H2-padT-padB}" fill="rgba(31,95,191,.10)"/>`;
      const wr = wrap3.getBoundingClientRect();
      tip3.hidden = false;
      tip3.innerHTML = `เข้าลงทุน <b>${thDate(pf.dates[c.i])}</b><br>ต่ำสุด ${thDate(pf.dates[c.ti])}: <b>${pct(c.dd, {dp: Math.abs(c.dd) < 0.001 ? 2 : 1})}</b><br>`
        + (c.active ? 'ยังไม่ฟื้นถึงมูลค่าวันที่เข้า' : `ฟื้น ${thDate(pf.dates[c.k])}: <b>${recLong(c.days).v} ${recLong(c.days).u}</b>`);
      tip3.style.left = Math.min(Math.max(rc.left - wr.left + x(c.i) * k, 90), wr.width - 90) + 'px';
      tip3.style.top = (ev.clientY - wr.top - 14) + 'px';
    });
  }
}

function noteHTML(r){
  if (!r.port) return '';
  const p = r.port, m = r.mdd, thr = (r.thr*100).toFixed(3).replace(/0+$/,'').replace(/\.$/,'');
  const rl = d => { const x = recLong(d); return x.v + ' ' + (x.u === 'months' ? 'เดือน' : 'ปี'); };
  const parts = [`ช่วงคำนวณ ${thDate(r.start)} – ${thDate(r.end)}`];
  parts.push(`<b>Median</b> Drawdown ${pct(p.cycDDMedian)} · Recovery ${rl(p.recMedian)} — คิดจาก ${p.nCycles.toLocaleString()} cycle (วันที่ถ้าเข้าลงทุนแล้วพอร์ตลงเกิน ${thr}% ภายใน 84 วันทำการ)`);
  if (m && m.dd < 0) parts.push(`<b>Max</b> Drawdown ${pct(m.dd)} — จุดสูงสุด ${thDate(m.peak)} → ต่ำสุด ${thDate(m.trough)} → `
    + (m.recovered ? `กลับถึงจุดสูงสุดเดิม ${thDate(m.rec)} · <b>Recovery ${rl(m.days)}</b>` : `<b>ยังไม่กลับถึงจุดสูงสุดเดิม</b> (ผ่านมาแล้ว ${rl(m.days)})`));
  if (r.research) parts.push(`ตัวเลขระดับพอร์ตใช้ NAV ของแผนจากทีม Research ถึง ${thDate(PLANNAV.cutoff)}${r.end > PLANNAV.cutoff ? ' แล้วต่อด้วยข้อมูล Model Performance' : ''} · ตารางรายโมเดลคำนวณจาก Model Performance`);
  if (r.div) parts.push(`รวมเงินปันผล DAA ${(DIV_YIELD.DAA*100).toFixed(1)}% ต่อปี (บวกแบบไม่ทบต้น) ใน Total Return และ 1Y Rolling Average เท่านั้น · กราฟและ Drawdown ไม่รวมปันผล`);
  if (r.backfilled.length && BACKFILL) parts.push('ใช้ผลทดสอบย้อนหลังสำหรับ ' + r.backfilled.map(b => `${b.m} ก่อน ${thDate(b.from)}`).join(' และ '));
  return parts.join('<br>');
}

    </div>`;
  const btn = el.querySelector('#upBtn'), panel = el.querySelector('#upPanel');
  const close = () => { panel.hidden = true; btn.setAttribute('aria-expanded', 'false'); };
  btn.onclick = e => { e.stopPropagation(); panel.hidden = !panel.hidden; btn.setAttribute('aria-expanded', String(!panel.hidden)); };
  panel.onclick = e => e.stopPropagation();
  el.querySelector('#upPick').onclick = () => { close(); pickFiles(); };
  document.addEventListener('click', close);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
}

/* ================= export: PNG + PPTX of the slide only ================= */
function exportName(ext){
  const plan = PLANS.find(p => p.id === state.plan), meta = planMeta(plan);
  return `${(plan.no ? 'Plan' + plan.no + '_' : '') + meta.name.replace(/[^\w฀-๿]+/g, '_')}_${state.end}.${ext}`;
}
function download(href, name){ const a = document.createElement('a'); a.href = href; a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
function exMsg(s){ const el = document.getElementById('exMsg'); if (el) el.textContent = s; }
async function exportPDF(){
  if (!window.htmlToImage || !window.jspdf){ exMsg('โหลดตัวช่วยสร้าง PDF ไม่สำเร็จ (ต้องต่ออินเทอร์เน็ต)'); return; }
  exMsg('กำลังสร้าง PDF…');
  try{
    const pdf = new jspdf.jsPDF({orientation: 'landscape', unit: 'mm', format: 'a4'});
    const PW = 297, PH = 210, M = 10, CW = PW - 2 * M;
    // each page: a list of sections stacked top to bottom, scaled to fit the page
    const pages = [['printHead', 'slide'], ['secEq'], ['secMed', 'cal'], ['hold']];
    let first = true;
    for (const ids of pages){
      const caps = []; for (const id of ids){ const c = await capture(id); if (c) caps.push(c); }
      if (!caps.length) continue;
      if (!first) pdf.addPage(); first = false;
      const gap = 5, natH = caps.reduce((a, c) => a + CW * c.h / c.w, 0) + gap * (caps.length - 1);
      const k = Math.min(1, (PH - 2 * M) / natH);
      let y = M;
      caps.forEach(c => { const w = CW * k, h = CW * c.h / c.w * k; pdf.addImage(c.url, 'PNG', M + (CW - w) / 2, y, w, h, undefined, 'FAST'); y += h + gap; });
    }
    pdf.save(exportName('pdf'));
    exMsg('');
  }catch(e){ console.error(e); exMsg('สร้าง PDF ไม่สำเร็จ: ' + (e.message || e)); }
}
const SEC_TITLES = {slide: 'Summary', secEq: 'Equity Curve & Drawdown', secMed: 'Median Drawdown', cal: 'ผลตอบแทนรายปี', hold: 'ผลตอบแทนตามระยะเวลาถือครอง'};
async function capture(id){
  const el = document.getElementById(id);
  if (!el || el.hidden) return null;
  document.body.classList.add('capturing');
  try{
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    const opt = id === 'slide' ? {width: 1280, height: 720, style: {transform: 'none'}} : {};
    const w = id === 'slide' ? 1280 : el.offsetWidth, h = id === 'slide' ? 720 : el.offsetHeight;
    const url = await htmlToImage.toPng(el, {pixelRatio: 2, backgroundColor: '#ffffff', ...opt});
    return {url, w, h};
  } finally { document.body.classList.remove('capturing'); }
}
async function copySlide(){
  if (!window.htmlToImage){ exMsg('โหลดตัวช่วยสร้างรูปไม่สำเร็จ (ต้องต่ออินเทอร์เน็ต)'); return; }
  const btn = document.getElementById('copySlide'), label = btn.textContent;
  btn.textContent = 'กำลังสร้างรูป…';
  try{
    const c = await capture('slide');
    const blob = await (await fetch(c.url)).blob();
    try{ await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]); btn.textContent = '✓ คัดลอกแล้ว'; }
    catch(e){ download(c.url, exportName('png')); btn.textContent = 'คัดลอกไม่ได้ — ดาวน์โหลดรูปแทน'; }
  }catch(e){ btn.textContent = 'สร้างรูปไม่สำเร็จ'; }
  setTimeout(() => { btn.textContent = label; }, 2200);
}
async function exportSection(id){
  if (!window.htmlToImage){ exMsg('โหลดตัวช่วยบันทึกรูปไม่สำเร็จ (ต้องต่ออินเทอร์เน็ต)'); return; }

}
async function exportPNG(){
  if (!window.htmlToImage){ exMsg('โหลดตัวช่วยบันทึกรูปไม่สำเร็จ (ต้องต่ออินเทอร์เน็ต)'); return; }

  try{

function hex(c){
  if (!c) return '000000';
  if (c.startsWith('var(')) c = getComputedStyle(document.documentElement).getPropertyValue(c.slice(4, -1)).trim();
  const m = c.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
  if (m) return [m[1], m[2], m[3]].map(x => (+x).toString(16).padStart(2, '0')).join('').toUpperCase();
  return c.replace('#', '').toUpperCase();
}
async function exportPPTX(){
  if (!window.PptxGenJS){ exMsg('โหลดตัวช่วยสร้าง PowerPoint ไม่สำเร็จ (ต้องต่ออินเทอร์เน็ต)'); return; }
  const r = compute(); if (!r.port){ exMsg('ยังไม่มีผลลัพธ์ให้บันทึก'); return; }
  exMsg('กำลังสร้างไฟล์…');
  try{
    const slideEl = document.getElementById('slide'), k = slideEl.getBoundingClientRect().width / 1280;
    const IN = px => px / 96;                       // 1280 px slide = 13.333 in
    const box = el => { const a = slideEl.getBoundingClientRect(), b = el.getBoundingClientRect();
      return {x: IN((b.left - a.left) / k), y: IN((b.top - a.top) / k), w: IN(b.width / k), h: IN(b.height / k)}; };
    const HF = 'BLS Bold', BF = 'BLS Text', NAVY = '16233A', POS = '16A34A', NEG = 'E3191B', GREY = '8B93A3';
    const pptx = new PptxGenJS(); pptx.layout = 'LAYOUT_WIDE';
    const s = pptx.addSlide(); s.background = {color: 'FFFFFF'};
    const plan = PLANS.find(p => p.id === state.plan), meta = planMeta(plan);
    const col = colorsFor(r.models, r.raw), amt = parseFloat(state.amount) || 0;

    // donut (editable chart) + labels from the on-screen layout
    const svg = slideEl.querySelector('.s-donut'), sb = box(svg), sx = sb.w / 500;
    const cx = 250, cy = 210, R = 146, ms = r.models;
    s.addChart(pptx.ChartType.doughnut, [{name: 'Portfolio', labels: ms, values: ms.map(m => +r.raw[m])}], {
      x: sb.x + (cx - R) * sx, y: sb.y + (cy - R) * sx, w: 2 * R * sx, h: 2 * R * sx,
      holeSize: 77, showLegend: false, showValue: false, showPercent: false, showLabel: false, firstSliceAng: 0,
      chartColors: ms.map(m => hex(col[m])), dataBorder: {pt: 1, color: 'FFFFFF'}, layout: {x: 0, y: 0, w: 1, h: 1}});
    svg.querySelectorAll('polyline').forEach(pl => {
      const pts = pl.getAttribute('points').trim().split(/\s+/).map(p => p.split(',').map(Number));
      const [x1, y1] = pts[0], [x2, y2] = pts[1];
      s.addShape(pptx.ShapeType.line, {x: sb.x + Math.min(x1, x2) * sx, y: sb.y + Math.min(y1, y2) * sx, w: Math.abs(x2 - x1) * sx, h: Math.abs(y2 - y1) * sx || 0.001,
        line: {color: '9AA3B2', width: 0.75}, flipH: (x2 < x1) !== (y2 < y1)});
    });
    svg.querySelectorAll('text').forEach(tx => {
      const b = box(tx), anchor = tx.getAttribute('text-anchor'), fs = +tx.getAttribute('font-size');
      const w = Math.max(b.w + 0.3, 1.4), x = anchor === 'end' ? b.x + b.w - w : anchor === 'middle' ? b.x + b.w / 2 - w / 2 : b.x;
      s.addText(tx.textContent, {x, y: b.y - 0.02, w, h: b.h + 0.04, margin: 0, fontFace: fs >= 22 ? HF : BF, fontSize: fs * 0.75, bold: +tx.getAttribute('font-weight') >= 600,
        color: hex(tx.getAttribute('fill')), align: anchor === 'end' ? 'right' : anchor === 'middle' ? 'center' : 'left', valign: 'middle'});
    });
    // legend
    slideEl.querySelectorAll('.s-legend span').forEach(sp => {
      const i = sp.querySelector('i'), bi = box(i), bs = box(sp);
      s.addShape(pptx.ShapeType.rect, {x: bi.x, y: bi.y, w: bi.w, h: bi.h, fill: {color: hex(i.style.background)}, line: {type: 'none'}});
      s.addText(sp.textContent.trim(), {x: bi.x + bi.w + 0.04, y: bs.y, w: bs.w, h: bs.h, margin: 0, fontFace: HF, fontSize: 11.25, bold: true, color: NAVY, valign: 'middle'});
    });
    // title block
    const tb = box(slideEl.querySelector('.s-title'));
    s.addShape(pptx.ShapeType.rect, {x: tb.x, y: tb.y, w: tb.w, h: tb.h, fill: {color: NAVY}, line: {type: 'none'}});
    s.addText(meta.risk ? [{text: meta.name, options: {fontFace: HF, fontSize: 30, bold: true, breakLine: true}},
               {text: `- Risk Profile: ${meta.risk} -`, options: {fontFace: BF, fontSize: 12, color: 'DFE5EF'}}]
             : [{text: meta.name, options: {fontFace: HF, fontSize: 30, bold: true}}],
      {x: tb.x, y: tb.y, w: tb.w, h: tb.h, align: 'center', valign: 'middle', color: 'FFFFFF', margin: 0});
    // table
    const tbl = slideEl.querySelector('.tbl'), tbB = box(tbl);
    const hdr = {fill: {color: NAVY}, color: 'FFFFFF', bold: true, fontFace: HF, align: 'center', valign: 'middle', fontSize: 12, border: {type: 'none'}};
    const thin = {type: 'solid', pt: 1, color: GREY}, none = {type: 'none'}, thick = {type: 'solid', pt: 3, color: NAVY};
    const rows = [[{text: 'Strategy', options: {...hdr, rowspan: 2}}, {text: 'Portfolio Model', options: {...hdr, rowspan: 2}},
                   {text: tbl.tHead.rows[0].cells[2].textContent.trim(), options: {...hdr, colspan: 4}}],
                  [...tbl.tHead.rows[1].cells].map(c => ({text: c.innerText.trim(), options: {...hdr, fontSize: 11}}))];
    const body = [...tbl.tBodies[0].rows];
    body.forEach((tr, ri) => {
      const last = ri === body.length - 1, row = [];
      [...tr.cells].forEach(td => {
        const span = +td.getAttribute('rowspan') || 1, endsLast = ri + span - 1 === body.length - 1;
        const base = {fontFace: BF, fontSize: 12, align: 'center', valign: 'middle', color: NAVY,
          border: [none, none, endsLast ? thick : thin, none]};
        if (td.classList.contains('strat')) row.push({text: td.innerText.trim(), options: {...base, fontSize: 11, rowspan: span}});
        else if (td.classList.contains('model')) row.push({text: [{text: '● ', options: {color: hex(td.querySelector('i').style.background), fontSize: 14}},
                                                                     {text: td.textContent.trim(), options: {bold: true, fontFace: HF}}], options: {...base, align: 'left'}});
        else { const dv = td.querySelector('.dv'), c = td.classList.contains('pos') ? POS : td.classList.contains('neg') ? NEG : NAVY;
          row.push({text: dv ? [{text: td.firstChild.textContent, options: {breakLine: true}}, {text: dv.textContent, options: {fontSize: 8, color: '333333'}}] : td.textContent.trim(), options: {...base, color: c}}); }
      });
      rows.push(row);
    });
    const colW = [...tbl.tHead.rows[0].cells].slice(0, 2).map(c => box(c).w).concat([...tbl.tHead.rows[1].cells].map(c => box(c).w));
    const rowH = [...tbl.tHead.rows].map(tr => box(tr).h).concat(body.map(tr => box(tr).h));
    s.addTable(rows, {x: tbB.x, y: tbB.y, w: tbB.w, colW, rowH, margin: 0.03, autoPage: false});
    // four boxes
    slideEl.querySelectorAll('.box').forEach(bx => {
      const h4 = box(bx.querySelector('h4')), bb = box(bx);
      s.addShape(pptx.ShapeType.rect, {x: h4.x, y: h4.y, w: h4.w, h: h4.h, fill: {color: NAVY}, line: {type: 'none'}});
      s.addText(bx.querySelector('h4').textContent.trim(), {x: h4.x, y: h4.y, w: h4.w, h: h4.h, margin: 0, fontFace: HF, fontSize: 13.5, bold: true, color: 'FFFFFF', align: 'center', valign: 'middle'});
      bx.querySelectorAll('.brow').forEach((rw, i, all) => {
        const b = box(rw), kEl = rw.querySelector('.k'), vEl = rw.querySelector('.v'), kb = box(kEl), vb = box(vEl);
        s.addText(kEl.innerText.trim(), {x: kb.x, y: b.y, w: kb.w, h: b.h, margin: 0, fontFace: BF, fontSize: +getComputedStyle(kEl).fontSize.replace('px', '') * 0.75, color: NAVY, align: 'center', valign: 'middle'});
        const u = vEl.querySelector('.u'), dv = vEl.querySelector('.dv'), main = (u || dv) ? vEl.firstChild.textContent : vEl.textContent;
        const vc = vEl.classList.contains('pos') ? POS : vEl.classList.contains('neg') ? NEG : NAVY, vfs = +getComputedStyle(vEl).fontSize.replace('px', '') * 0.75;
        s.addText(u ? [{text: main, options: {fontSize: vfs}}, {text: ' ' + u.textContent, options: {fontSize: 12.75, bold: false, fontFace: BF}}]
                 : dv ? [{text: main, options: {fontSize: vfs, breakLine: true}}, {text: dv.textContent, options: {fontSize: 8, bold: false, fontFace: BF, color: '333333'}}] : main,
          {x: vb.x, y: b.y, w: vb.w, h: b.h, margin: 0, fontFace: HF, fontSize: vfs, bold: true, color: vc, align: 'center', valign: 'middle'});
        if (i < all.length - 1) s.addShape(pptx.ShapeType.line, {x: b.x, y: b.y + b.h, w: b.w, h: 0, line: {color: GREY, width: 1}});
      });
      s.addShape(pptx.ShapeType.rect, {x: bb.x, y: bb.y + bb.h - IN(4), w: bb.w, h: IN(4), fill: {color: NAVY}, line: {type: 'none'}});
    });
    // table bottom bar
    s.addShape(pptx.ShapeType.rect, {x: tbB.x, y: tbB.y + tbB.h, w: tbB.w, h: IN(4), fill: {color: NAVY}, line: {type: 'none'}});
    // footnote
    const ft = slideEl.querySelector('.foot'), fb = box(ft), lines = ft.innerText.split('\n');
    s.addText(lines.map((l, i) => ({text: l, options: {breakLine: i < lines.length - 1}})),
      {x: fb.x - 0.2, y: fb.y, w: fb.w + 0.2, h: fb.h, margin: 0, fontFace: BF, fontSize: 8, color: '333333', align: 'right', valign: 'middle'});
    // further slides: each chart section as a picture
    if (window.htmlToImage){
      for (const id of ['secEq', 'secMed', 'cal', 'hold']){
        const c = await capture(id); if (!c) continue;
        const sl = pptx.addSlide(); sl.background = {color: 'FFFFFF'};
        const maxW = 12.73, maxH = 6.9, k = Math.min(maxW / (c.w / 96), maxH / (c.h / 96));
        const w = c.w / 96 * k, h = c.h / 96 * k;
        sl.addImage({data: c.url, x: (13.333 - w) / 2, y: (7.5 - h) / 2, w, h});
      }
    }
    await pptx.writeFile({fileName: exportName('pptx')});
    exMsg('');
  }catch(e){ console.error(e); exMsg('สร้าง PowerPoint ไม่สำเร็จ: ' + (e.message || e)); }
}

/* scale the 1280x720 slide to the available width */
function fit(){
  const sc = document.getElementById('scaler'), sl = document.getElementById('slide');
  if (!sc || !sl) return;
  const k = sc.clientWidth / 1280;
  sl.style.transform = `scale(${k})`; sc.style.height = (720*k) + 'px';
}
window.addEventListener('resize', fit);
window.addEventListener('beforeprint', fit);
window.addEventListener('afterprint', fit);
if (window.ResizeObserver) new ResizeObserver(fit).observe(document.body);

/* boot */
DATA = load();
if (DATA && DATA.csv){ prepare(); setPeriod('all'); }
render();
